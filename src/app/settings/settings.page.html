<app-app-bar title="Settings"></app-app-bar>

<ion-content>
  <div class="settings-layout">
  <ion-list class="settings-list">
    <ion-item lines="none" *ngIf="authError" role="alert">
      <ion-label color="danger">{{ authError }}</ion-label>
    </ion-item>

    <ion-item>
      <ion-label>Color Blind Mode</ion-label>
      <ion-toggle 
        [(ngModel)]="colorBlindMode" 
        (ionChange)="onColorBlindModeChange($event)">
      </ion-toggle>
    </ion-item>

    <ion-item>
      <ion-label>Theme</ion-label>
      <ion-select 
        [(ngModel)]="selectedTheme" 
        (ionChange)="onThemeChange($event)"
        [disabled]="colorBlindMode"
        interface="popover">
        <ion-select-option value="default">Default</ion-select-option>
        <ion-select-option value="light">Light</ion-select-option>
        <ion-select-option value="dark">Dark</ion-select-option>
      </ion-select>
    </ion-item>

  </ion-list>

  <section class="admin-card" aria-labelledby="admin-heading">
    <div class="admin-copy">
      <h2 id="admin-heading">Administrator</h2>
      <p>Sign in to add, edit, or remove historical content.</p>
    </div>
    <ion-button expand="block" shape="round" [routerLink]="['/tabs/user']">
      Admin Login
    </ion-button>
  </section>
  </div>
</ion-content>
