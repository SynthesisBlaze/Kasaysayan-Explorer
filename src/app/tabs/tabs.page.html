<ion-tabs>
  <ion-router-outlet></ion-router-outlet>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="discover">
      <div class="tab-icon"><ion-icon aria-hidden="true" name="navigate-circle"></ion-icon></div>
      <ion-label>Discover</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="search">
      <div class="tab-icon"><ion-icon aria-hidden="true" name="search"></ion-icon></div>
      <ion-label>Search</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="quizMenu">
      <div class="tab-icon"><ion-icon aria-hidden="true" name="receipt"></ion-icon></div>
      <ion-label>Quiz</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="favorites">
      <div class="tab-icon"><ion-icon name="bookmarks-outline"></ion-icon></div>
      <ion-label>Favorites</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings">
      <div class="tab-icon"><ion-icon aria-hidden="true" name="settings"></ion-icon></div>
      <ion-label>Settings</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="user">
      <div class="tab-icon"><ion-icon aria-hidden="true" name="person-circle"></ion-icon></div>
      <ion-label>User</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
