<ion-content class="ion-padding page-bg">

  <!-- Custom Header -->
  <div class="custom-header">
    <button type="button" class="icon-btn back-btn" aria-label="Go back" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <h1 class="page-title">Historical Events</h1>
  </div>

  <!-- Loading Spinner -->
  <ion-spinner *ngIf="loading" name="crescent" color="light"></ion-spinner>

  <!-- Events Grid -->
  <div class="events-grid" *ngIf="!loading">
    <ion-card
      class="event-card"
      *ngFor="let event of events"
      (click)="openEvent(event.id)"
      [style.background-image]="'url(' + event.imgPath + ')'"
    >
      <div class="overlay"></div>
      <div class="event-title">{{ event.name }}</div>
    </ion-card>
  </div>

</ion-content>
