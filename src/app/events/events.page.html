<ion-content fullscreen [scrollY]="false">
  <div class="loading-overlay" *ngIf="isLoading" role="status">
    <ion-spinner name="crescent"></ion-spinner>
    <div class="loading-text">Loading content…</div>
  </div>

  <div class="figure" [style.background-image]="events?.imgPath ? 'url(' + events.imgPath + ')' : ''">
    <button class="figure-back" type="button" (click)="goBack()" aria-label="Back">
      <ion-icon name="arrow-back" aria-hidden="true"></ion-icon>
    </button>

    <div #eventsCaption class="figure-caption">
      <div class="figure-title">
        <h1>{{ events?.name }}</h1>
        <p *ngIf="events?.date">{{ events?.date }}</p>
      </div>
    </div>

    <div class="figure-actions-corner">
      <button type="button" class="fav" (click)="toggleFavorite()" [attr.aria-pressed]="isFav"
        [attr.aria-label]="isFav ? 'Remove from favorites' : 'Add to favorites'">
        <ion-icon [name]="isFav ? 'heart' : 'heart-outline'" aria-hidden="true"></ion-icon>
      </button>

      <button type="button" class="speak" (click)="toggleSpeak()" [attr.aria-pressed]="isSpeaking"
        [attr.aria-label]="isSpeaking ? 'Stop reading aloud' : 'Read aloud'">
        <ion-icon [name]="isSpeaking ? 'stop' : 'volume-high'" aria-hidden="true"></ion-icon>
      </button>
    </div>
  </div>

  <div class="sheet" [class.dragging]="isDragging" [style.top.px]="sheetTop">

    <div class="sheet-header" (pointerdown)="startDrag($event)" (pointermove)="onDrag($event)"
      (pointerup)="endDrag($event)" (pointercancel)="endDrag($event)">
      <div class="handle-wrap" role="button" tabindex="0" [attr.aria-expanded]="!showHandle"
        [attr.aria-label]="showHandle ? 'Expand to read more' : 'Collapse'"
        (keydown.enter)="toggleSheet()" (keydown.space)="$event.preventDefault(); toggleSheet()">
        <span class="handle"></span>
        <span class="handle-label">{{ showHandle ? 'Swipe up to read more' : 'Swipe down to see image' }}</span>
      </div>

      <ion-segment [value]="activeTab" (ionChange)="setTab($event.detail.value)">
        <ion-segment-button value="description">Description</ion-segment-button>
        <ion-segment-button value="details">Details</ion-segment-button>
        <ion-segment-button value="refs">References</ion-segment-button>
      </ion-segment>
    </div>

    <div class="tab-content">
      <div *ngIf="activeTab === 'description'">
        <p class="text" *ngIf="events?.description; else noContent">{{ events?.description }}</p>
      </div>

      <div *ngIf="activeTab === 'details'">
        <ul class="bullet-list" *ngIf="details.length; else noContent">
          <li *ngFor="let f of details">{{ f }}</li>
        </ul>
      </div>

      <div *ngIf="activeTab === 'refs'">
        <ul class="bullet-list" *ngIf="refs.length; else noContent">
          <li *ngFor="let r of refs">{{ r }}</li>
        </ul>
      </div>

      <ng-template #noContent>
        <p class="tab-empty" *ngIf="!isLoading">Nothing here yet.</p>
      </ng-template>
    </div>
  </div>
</ion-content>
